name: typst-bot
services:
    bot:
        # This service is built using the Dockerfile in the current directory.
        build: .
        # This service is always restarted if it ever shuts down (unless stopped manually).
        restart: always
        # The token is passed from the host environment and is not saved in the image or in a file.
        environment:
            DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN must be set}
        # Package cache and bot settings use separate named volumes.
        volumes:
            - cache:/bot/cache
            - settings:/bot/settings

# Package cache and bot settings are stored in named volumes managed by Docker.
volumes:
    cache:
    settings:
